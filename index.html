<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B3A 富泰邨 → 深圳灣口岸</title>
<style>
  :root{
    --bg:#0d1117;
    --card:#161b22;
    --line:#26303d;
    --fg:#e6edf3;
    --muted:#8b949e;
    --accent:#00b0ff;
    --accent2:#00e676;
    --warn:#ffb300;
    --err:#ff5252;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(1200px 600px at 50% -10%,#123049 0%,var(--bg) 60%);
    color:var(--fg);
    font:16px/1.45 -apple-system,"Segoe UI",Roboto,"PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 16px 40px;
  }
  .wrap{width:100%;max-width:560px}

  header{text-align:center;margin-bottom:18px}
  .route{
    display:inline-flex;align-items:center;gap:10px;
    background:#1f6feb1a;border:1px solid #1f6feb55;
    color:#8ecbff;border-radius:999px;
    padding:6px 16px;font-weight:700;letter-spacing:.08em;font-size:15px;
  }
  h1{font-size:22px;margin:14px 0 4px;font-weight:650}
  .sub{color:var(--muted);font-size:14px}
  .arrow{color:var(--accent);padding:0 6px}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 18px 8px;
    box-shadow:0 10px 30px #0006;
  }

  ul{list-style:none;margin:0;padding:0}
  li{
    display:flex;align-items:baseline;gap:12px;
    padding:14px 4px;
    border-top:1px solid var(--line);
  }
  li:first-child{border-top:0;padding-top:6px}
  .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--muted);flex:0 0 auto;
    align-self:center;
  }
  li.live .dot{background:var(--accent2);box-shadow:0 0 0 4px #00e67622;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px #00e67600}}

  .min{
    font-variant-numeric:tabular-nums;
    font-weight:750;
    font-size:34px;
    line-height:1;
    min-width:2.2ch;
    text-align:right;
    margin-left:auto;
    color:var(--accent);
  }
  li.live .min{color:var(--accent2)}
  .min small{font-size:14px;font-weight:600;color:var(--muted);margin-left:5px}
  .min.soon{font-size:22px}
  .min.none{color:var(--muted);font-size:20px;font-weight:600}

  .meta{font-size:13px;color:var(--muted)}
  .meta b{color:#c9d1d9;font-weight:600}
  .seq{font-size:12px;color:#6e7681;letter-spacing:.06em;text-transform:uppercase}
  .rmk{color:var(--warn);font-size:13px}

  footer{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;
  }
  button{
    background:#21262d;color:var(--fg);border:1px solid var(--line);
    border-radius:9px;padding:7px 13px;font-size:13px;cursor:pointer;
    font-family:inherit;
  }
  button:hover{background:#2b323b}
  button:active{transform:translateY(1px)}

  .status{margin-top:14px;font-size:13.5px;border-radius:10px;padding:11px 13px;display:none}
  .status.show{display:block}
  .status.err{background:#ff52521a;border:1px solid #ff525255;color:#ffb3b3}
  .status.info{background:#ffb3001a;border:1px solid #ffb30055;color:#ffdb8a}
  .footnote{margin-top:16px;text-align:center;font-size:12px;color:#5c6672;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="route">城巴 CITYBUS · B3A</div>
    <h1>富泰邨 <span class="arrow">→</span> 深圳灣口岸</h1>
    <div class="sub">富泰邨, 青山公路 · 往深圳灣口岸</div>
  </header>

  <div class="card">
    <ul id="list"></ul>
    <div id="status" class="status"></div>
    <footer>
      <span id="updated">載入中…</span>
      <button id="refresh" type="button">立即更新</button>
    </footer>
  </div>

  <div class="footnote">
    資料來源：DATA.GOV.HK 城巴實時到站數據 · 每 30 秒自動更新<br>
    到站時間為預計時間，實際班次以現場為準
  </div>

</div>

<script>
(() => {
  "use strict";

  // 城巴 (CTB) B3A 往深圳灣口岸方向，於「富泰邨, 青山公路」(003261) 的實時到站
  const ROUTE   = "B3A";
  const STOP_ID = "003261";
  const DIR     = "O";                 // O = 往深圳灣口岸
  const API     = `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${STOP_ID}/${ROUTE}`;
  const INTERVAL_MS = 30000;           // 每 30 秒重新抓取

  const listEl   = document.getElementById("list");
  const statusEl = document.getElementById("status");
  const updatedEl= document.getElementById("updated");

  let etas = [];          // [{ at: Date, seq: Number, rmk: String }]
  let skewMs = 0;         // 伺服器時間 - 本機時間
  let lastFetch = null;
  let lastError = null;

  const now = () => Date.now() + skewMs;

  function fmtTime(d){
    if (!d) return "--:--";
    const p = n => String(n).padStart(2, "0");
    return `${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function setStatus(kind, msg){
    statusEl.className = "status show " + kind;
    statusEl.textContent = msg;
  }
  function clearStatus(){
    statusEl.className = "status";
    statusEl.textContent = "";
  }

  // 把一棵 ETA 記錄轉為「還有幾多分鐘」
  function remainingMs(eta){
    return eta.at.getTime() - now();
  }

  function renderList(){
    const active = etas.filter(e => remainingMs(e) > -30000);   // 剛過站的仍顯示一會

    if (!active.length){
      listEl.innerHTML =
        `<li><span class="dot"></span>` +
        `<span class="meta">暫時沒有預定班次</span>` +
        `<span class="min none">—</span></li>`;
      return;
    }

    listEl.innerHTML = active.map((e, i) => {
      const ms = remainingMs(e);
      const min = Math.floor(ms / 60000);
      const live = i === 0 && ms < 60000;
      let num, unit = "";
      if (ms < 60000){
        num = "即將到站";
        unit = "";
      } else {
        num = String(min);
        unit = "分鐘";
      }
      const soon = typeof num === "string" && num.length > 3;
      return `<li class="${live ? "live" : ""}">` +
          `<span class="dot"></span>` +
          `<span>` +
            `<div class="meta"><b>${fmtTime(e.at)}</b> 到站</div>` +
            `<div class="seq">第 ${e.seq} 班${i === 0 ? " · 下一班" : ""}</div>` +
            (e.rmk ? `<div class="rmk">${e.rmk}</div>` : "") +
          `</span>` +
          `<span class="min ${soon ? "soon" : ""}">${num}${unit ? `<small>${unit}</small>` : ""}</span>` +
        `</li>`;
    }).join("");
  }

  function renderFooter(){
    if (lastError){
      updatedEl.textContent = "更新失敗 · " + fmtTime(new Date(lastFetch || Date.now()));
    } else if (lastFetch){
      updatedEl.textContent = "上次更新 " + fmtTime(new Date(lastFetch));
    } else {
      updatedEl.textContent = "載入中…";
    }
  }

  async function load(){
    try{
      const res = await fetch(API + "?_=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const payload = await res.json();

      // 以伺服器時間校正本機時鐘
      const serverTs = Date.parse(payload.generated_timestamp || "");
      if (!Number.isNaN(serverTs)) skewMs = serverTs - Date.now();

      const rows = Array.isArray(payload.data) ? payload.data : [];
      etas = rows
        .filter(r => r.co === "CTB" && r.route === ROUTE && r.stop === STOP_ID && r.dir === DIR && r.eta)
        .map(r => ({
          at : new Date(r.eta),
          seq: r.eta_seq || 0,
          rmk: r.rmk_tc || r.rmk_en || ""
        }))
        .filter(e => !Number.isNaN(e.at.getTime()))
        .sort((a, b) => a.at - b.at);

      lastFetch = Date.now();
      lastError = null;

      if (!etas.length){
        setStatus("info", "城巴暫未提供下一班 B3A 的預計到站時間（可能已收車）。");
      } else {
        clearStatus();
      }
    }catch(err){
      lastFetch = lastFetch || Date.now();
      lastError = err;
      setStatus("err", "無法取得實時數據：" + (err && err.message ? err.message : err) +
                       "　請檢查網絡連線後按「立即更新」。");
    }
    renderList();
    renderFooter();
  }

  document.getElementById("refresh").addEventListener("click", load);

  // 每秒重繪倒數，每 30 秒抓取新數據
  renderList();
  load();
  setInterval(renderList, 1000);
  setInterval(load, INTERVAL_MS);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - (lastFetch || 0) > 5000) load();
  });
})();
</script>
</body>
</html>
